server {
    listen 80;
    server_name _;
    server_tokens off;

    # gzip
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Allow large image uploads
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets with long cache
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Proxy API and file downloads to the FastAPI backend.
    # "backend" is the docker-compose service name.
    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA: fall back to index.html for any unmatched route
    location / {
        try_files $uri $uri/ /index.html;
    }
}
